<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학생 운동 기록 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8fafc;
    }
    .sport-card input:checked + div {
      border-color: #2563eb;
      background-color: #eff6ff;
      color: #1d4ed8;
      box-shadow: 0 0 0 1px #2563eb;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-slate-900">학생 운동 기록장</h1>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span id="syncStatus" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
          <span id="syncDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="syncText">시트 연결 중...</span>
        </span>
        <button id="refreshBtn" type="button" title="새로고침" class="p-2 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors">
          <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- 왼쪽: 기록 입력 폼 -->
      <section class="lg:col-span-5 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
        <div class="mb-5">
          <h2 class="text-base font-bold text-slate-900">새 운동 기록 입력</h2>
          <p class="text-xs text-slate-500 mt-0.5">학생과 종목을 선택한 뒤 측정 기록을 저장하세요.</p>
        </div>

        <form id="recordForm" class="space-y-5">
          <!-- 1. 학생 이름 드롭다운 -->
          <div>
            <label for="studentSelect" class="block text-sm font-semibold text-slate-700 mb-1.5">
              학생 이름 <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <select id="studentSelect" required class="w-full appearance-none rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 pr-10 text-sm font-medium text-slate-800 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 transition-all disabled:bg-slate-100 disabled:text-slate-400">
                <option value="">학생 명단 불러오는 중...</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>
          </div>

          <!-- 2. 운동 종목 선택 -->
          <div>
            <span class="block text-sm font-semibold text-slate-700 mb-1.5">
              운동 종목 <span class="text-rose-500">*</span>
            </span>
            <div class="grid grid-cols-3 gap-2.5">
              <label class="sport-card cursor-pointer">
                <input type="radio" name="sport" value="달리기" class="sr-only" checked />
                <div class="rounded-xl border border-slate-200 bg-slate-50/50 py-3 px-2 text-center transition-all hover:bg-slate-50">
                  <div class="text-xl mb-1">🏃</div>
                  <div class="text-xs font-bold">달리기</div>
                </div>
              </label>

              <label class="sport-card cursor-pointer">
                <input type="radio" name="sport" value="축구" class="sr-only" />
                <div class="rounded-xl border border-slate-200 bg-slate-50/50 py-3 px-2 text-center transition-all hover:bg-slate-50">
                  <div class="text-xl mb-1">⚽</div>
                  <div class="text-xs font-bold">축구</div>
                </div>
              </label>

              <label class="sport-card cursor-pointer">
                <input type="radio" name="sport" value="줄넘기" class="sr-only" />
                <div class="rounded-xl border border-slate-200 bg-slate-50/50 py-3 px-2 text-center transition-all hover:bg-slate-50">
                  <div class="text-xl mb-1">🪢</div>
                  <div class="text-xs font-bold">줄넘기</div>
                </div>
              </label>
            </div>
          </div>

          <!-- 3. 측정 기록 입력 -->
          <div>
            <label for="recordInput" class="block text-sm font-semibold text-slate-700 mb-1.5">
              측정 기록 <span class="text-rose-500">*</span>
            </label>
            <input
              type="text"
              id="recordInput"
              required
              placeholder="예: 50m 8.4초"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 transition-all"
            />
            <!-- 빠른 입력 추천 칩 -->
            <div id="quickChips" class="flex flex-wrap gap-1.5 mt-2"></div>
          </div>

          <!-- 4. 선택 메모 -->
          <div>
            <label for="memoInput" class="block text-sm font-semibold text-slate-700 mb-1.5">
              메모 <span class="text-xs font-normal text-slate-400">(선택)</span>
            </label>
            <input
              type="text"
              id="memoInput"
              placeholder="예: 자세가 안정적임, 개인 최고 기록"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 transition-all"
            />
          </div>

          <!-- 제출 버튼 -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm py-3 px-4 shadow-sm transition-all flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            <span id="submitBtnText">기록 저장하기</span>
          </button>
        </form>
      </section>

      <!-- 오른쪽: 최신 운동 기록 목록 -->
      <section class="lg:col-span-7 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-base font-bold text-slate-900">운동 기록 목록</h2>
              <span id="totalBadge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">0건</span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">가장 최근에 저장된 기록부터 순서대로 표시됩니다.</p>
          </div>

          <!-- 종목 필터 탭 -->
          <div class="inline-flex rounded-xl bg-slate-100 p-1 self-start sm:self-auto" role="tablist">
            <button type="button" data-filter="전체" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-900 shadow-sm transition-all">전체</button>
            <button type="button" data-filter="달리기" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all">달리기</button>
            <button type="button" data-filter="축구" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all">축구</button>
            <button type="button" data-filter="줄넘기" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all">줄넘기</button>
          </div>
        </div>

        <!-- 기록 리스트 컨테이너 -->
        <div id="recordList" class="space-y-3 max-h-[560px] overflow-y-auto pr-1 custom-scrollbar">
          <!-- 초기 로딩 스켈레톤 -->
          <div class="animate-pulse space-y-3">
            <div class="h-20 bg-slate-100 rounded-xl"></div>
            <div class="h-20 bg-slate-100 rounded-xl"></div>
            <div class="h-20 bg-slate-100 rounded-xl"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- 토스트 알림 -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none">
    <div id="toastInner" class="bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2">
      <span id="toastMessage">저장되었습니다.</span>
    </div>
  </div>

  <script>
    // Google Apps Script 웹 앱 URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbyR6TjzfAZ6sSs1HiWOZG_jhO_nPQCXHyAkFThGlGF5D919jrswGE4-SehR6WBd8NEe/exec';

    let records = [];
    let students = [];
    let currentFilter = '전체';
    let isLoading = false;

    // 종목별 스타일 및 빠른 입력 칩 설정
    const sportMeta = {
      '달리기': {
        emoji: '🏃',
        badgeClass: 'bg-sky-50 text-sky-700 border-sky-200',
        placeholder: '예: 50m 8.4초 / 오래달리기 4분 15초',
        chips: ['50m 8.2초', '50m 8.9초', '100m 15.4초', '오래달리기 완주']
      },
      '축구': {
        emoji: '⚽',
        badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        placeholder: '예: 리프팅 35회 / 드리블 14.2초',
        chips: ['리프팅 20회', '리프팅 45회', '슈팅 5골 성공', '드리블 13.8초']
      },
      '줄넘기': {
        emoji: '🪢',
        badgeClass: 'bg-amber-50 text-amber-700 border-amber-200',
        placeholder: '예: 1분 양발모아뛰기 112회 / 2단뛰기 25회',
        chips: ['1분 95회', '1분 120회', '2단뛰기 15회', '2단뛰기 30회']
      }
    };

    // DOM 요소
    const studentSelect = document.getElementById('studentSelect');
    const recordForm = document.getElementById('recordForm');
    const recordInput = document.getElementById('recordInput');
    const memoInput = document.getElementById('memoInput');
    const quickChips = document.getElementById('quickChips');
    const recordList = document.getElementById('recordList');
    const totalBadge = document.getElementById('totalBadge');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncText');
    const refreshBtn = document.getElementById('refreshBtn');
    const refreshIcon = document.getElementById('refreshIcon');

    // 연결 상태 배지 업데이트
    function setSyncStatus(state, text) {
      syncText.textContent = text;
      syncDot.className = 'w-2 h-2 rounded-full';
      if (state === 'loading') {
        syncDot.classList.add('bg-amber-400', 'animate-pulse');
      } else if (state === 'connected') {
        syncDot.classList.add('bg-emerald-500');
      } else {
        syncDot.classList.add('bg-rose-500');
      }
    }

    // 토스트 알림 표시
    let toastTimer;
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastInner = document.getElementById('toastInner');
      const toastMessage = document.getElementById('toastMessage');

      toastMessage.textContent = message;
      toastInner.className = isError
        ? 'bg-rose-600 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2'
        : 'bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2';

      toast.classList.remove('translate-y-16', 'opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2800);
    }

    // 학생 명단 드롭다운 채우기
    function populateStudentDropdown(studentList) {
      const previousSelected = studentSelect.value;
      studentSelect.innerHTML = '';

      if (!Array.isArray(studentList) || studentList.length === 0) {
        const emptyOpt = document.createElement('option');
        emptyOpt.value = '';
        emptyOpt.textContent = '등록된 학생 명단이 없습니다';
        studentSelect.appendChild(emptyOpt);
        return;
      }

      const defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = '학생을 선택하세요';
      studentSelect.appendChild(defaultOpt);

      studentList.forEach(student => {
        const opt = document.createElement('option');
        opt.value = student.name;
        const numPrefix = student.number ? `${student.number}번 ` : '';
        const genderSuffix = student.gender ? ` (${student.gender})` : '';
        opt.textContent = `${numPrefix}${student.name}${genderSuffix}`;
        studentSelect.appendChild(opt);
      });

      if (previousSelected && studentList.some(s => s.name === previousSelected)) {
        studentSelect.value = previousSelected;
      }
    }

    // 빠른 입력 칩 렌더링
    function renderQuickChips(sport) {
      const meta = sportMeta[sport] || sportMeta['달리기'];
      recordInput.placeholder = meta.placeholder;
      quickChips.innerHTML = meta.chips.map(chip => `
        <button type="button" class="chip-btn text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-600 transition-colors">
          ${chip}
        </button>
      `).join('');

      document.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          recordInput.value = btn.textContent.trim();
          recordInput.focus();
        });
      });
    }

    // 운동 기록 목록 렌더링
    function renderRecords() {
      const filtered = currentFilter === '전체'
        ? records
        : records.filter(item => item.sport === currentFilter);

      totalBadge.textContent = `${filtered.length}건`;

      if (filtered.length === 0) {
        recordList.innerHTML = `
          <div class="text-center py-14 px-4 border border-dashed border-slate-200 rounded-2xl">
            <div class="text-3xl mb-2">📋</div>
            <p class="text-sm font-semibold text-slate-700">표시할 운동 기록이 없습니다</p>
            <p class="text-xs text-slate-400 mt-1">왼쪽 입력 폼에서 첫 번째 운동 기록을 추가해 보세요.</p>
          </div>
        `;
        return;
      }

      recordList.innerHTML = filtered.map(item => {
        const meta = sportMeta[item.sport] || { emoji: '🏅', badgeClass: 'bg-slate-100 text-slate-700 border-slate-200' };
        return `
          <article class="group rounded-xl border border-slate-200/90 bg-white hover:border-blue-300 hover:shadow-sm p-4 transition-all">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-lg shrink-0">
                  ${meta.emoji}
                </div>
                <div>
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="font-bold text-sm text-slate-900">${escapeHtml(item.name)}</span>
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md border ${meta.badgeClass}">
                      ${escapeHtml(item.sport)}
                    </span>
                  </div>
                  <p class="text-sm font-semibold text-blue-700 mt-1">${escapeHtml(item.record)}</p>
                </div>
              </div>
              <time class="text-[11px] text-slate-400 whitespace-nowrap shrink-0">${escapeHtml(item.timestamp || '')}</time>
            </div>
          </article>
        `;
      }).join('');
    }

    // XSS 방지용 이스케이프
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // GET 요청: 기록 및 학생 명단 조회 (커스텀 헤더 없이 호출하여 CORS 방지)
    async function fetchRecords() {
      if (isLoading) return;
      isLoading = true;
      setSyncStatus('loading', '데이터 동기화 중...');
      refreshIcon.classList.add('animate-spin');

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();

        if (result.status === 'success') {
          records = Array.isArray(result.data) ? result.data : [];
          if (Array.isArray(result.students)) {
            students = result.students;
            populateStudentDropdown(students);
          }
          renderRecords();
          setSyncStatus('connected', 'Google Sheets 연결됨');
        } else {
          throw new Error(result.message || '데이터를 불러오지 못했습니다.');
        }
      } catch (error) {
        console.error('Fetch error:', error);
        setSyncStatus('error', '연결 오류');
        showToast('시트 데이터를 불러오는 중 오류가 발생했습니다.', true);
        if (records.length === 0) {
          recordList.innerHTML = `
            <div class="text-center py-12 px-4 border border-dashed border-rose-200 bg-rose-50/40 rounded-2xl">
              <p class="text-sm font-semibold text-rose-700">데이터를 불러올 수 없습니다</p>
              <p class="text-xs text-rose-500 mt-1">Apps Script 배포 상태와 권한(모든 사용자)을 확인해 주세요.</p>
            </div>
          `;
        }
      } finally {
        isLoading = false;
        refreshIcon.classList.remove('animate-spin');
      }
    }

    // POST 요청: 새 기록 저장 (커스텀 헤더 없이 전송하여 CORS 프리플라이트 방지)
    recordForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = studentSelect.value.trim();
      const sport = document.querySelector('input[name="sport"]:checked').value;
      const rawRecord = recordInput.value.trim();
      const memo = memoInput.value.trim();

      if (!name || !rawRecord) {
        showToast('학생 이름과 측정 기록을 모두 입력해 주세요.', true);
        return;
      }

      const finalRecord = memo ? `${rawRecord} (${memo})` : rawRecord;

      submitBtn.disabled = true;
      submitBtnText.innerHTML = `
        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <span>저장 중...</span>
      `;
      setSyncStatus('loading', '기록 저장 중...');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          // 커스텀 헤더 생략 -> text/plain;charset=UTF-8 로 전송되어 CORS preflight 회피
          body: JSON.stringify({
            name: name,
            sport: sport,
            record: finalRecord
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();

        if (result.status === 'success') {
          // 새 기록을 목록 최상단에 즉시 반영
          records.unshift({
            name: result.data.name,
            sport: result.data.sport,
            record: result.data.record,
            timestamp: result.data.timestamp
          });
          renderRecords();

          // 입력창 초기화 (학생 선택은 연속 입력 편의를 위해 유지)
          recordInput.value = '';
          memoInput.value = '';
          setSyncStatus('connected', 'Google Sheets 연결됨');
          showToast(`${name} 학생의 ${sport} 기록이 저장되었습니다.`);
        } else {
          throw new Error(result.message || '저장에 실패했습니다.');
        }
      } catch (error) {
        console.error('Save error:', error);
        setSyncStatus('error', '저장 실패');
        showToast('기록 저장 중 오류가 발생했습니다.', true);
      } finally {
        submitBtn.disabled = false;
        submitBtnText.textContent = '기록 저장하기';
      }
    });

    // 종목 라디오 버튼 변경 시 빠른 입력 칩 갱신
    document.querySelectorAll('input[name="sport"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        renderQuickChips(e.target.value);
      });
    });

    // 필터 탭 클릭 이벤트
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all';
        });
        btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-900 shadow-sm transition-all';
        renderRecords();
      });
    });

    // 수동 새로고침 버튼
    refreshBtn.addEventListener('click', fetchRecords);

    // 초기 실행
    renderQuickChips('달리기');
    fetchRecords();
  </script>
</body>
</html>
